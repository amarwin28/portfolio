<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#141926" />
      <stop offset="100%" stop-color="#090c12" />
    </linearGradient>
    <linearGradient id="nsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <pattern id="nsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <filter id="nsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#nsBg)"/>
  <rect width="800" height="500" fill="url(#nsGrid)"/>

  <circle cx="400" cy="220" r="170" fill="#f59e0b" opacity="0.08" filter="url(#nsGlow)"/>

  <!-- Showcase multi-screen composition -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="16" fill="#10141f" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.5"/>

    <!-- Desktop Screen Mockup inside frame -->
    <g transform="translate(40, 50)">
      <rect width="360" height="230" rx="10" fill="#171e2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect width="360" height="26" rx="10" fill="#1f273b"/>
      <rect y="20" width="360" height="6" fill="#1f273b"/>
      <circle cx="15" cy="13" r="3.5" fill="#ef4444"/>
      <circle cx="28" cy="13" r="3.5" fill="#f59e0b"/>
      <circle cx="41" cy="13" r="3.5" fill="#10b981"/>
      
      <!-- Mini hero banner inside mockup -->
      <rect x="20" y="42" width="200" height="18" rx="4" fill="url(#nsGold)" opacity="0.9"/>
      <rect x="20" y="68" width="140" height="8" rx="3" fill="#6b7280"/>
      <rect x="20" y="82" width="100" height="8" rx="3" fill="#4b5563"/>
      <rect x="20" y="104" width="70" height="20" rx="4" fill="url(#nsGold)"/>

      <!-- Mini grid inside mockup -->
      <g transform="translate(20, 140)">
        <rect width="95" height="65" rx="5" fill="#111624"/>
        <rect x="110" width="95" height="65" rx="5" fill="#111624"/>
        <rect x="220" width="100" height="65" rx="5" fill="#111624"/>
      </g>
    </g>

    <!-- Mobile Screen floating on the right -->
    <g transform="translate(430, 80)">
      <rect width="130" height="250" rx="16" fill="#151b29" stroke="url(#nsGold)" stroke-width="1.5"/>
      <rect x="45" y="8" width="40" height="6" rx="3" fill="#242d40"/>
      <rect x="15" y="30" width="100" height="22" rx="4" fill="url(#nsGold)" opacity="0.85"/>
      <rect x="15" y="62" width="100" height="45" rx="6" fill="#1b2336"/>
      <rect x="15" y="118" width="100" height="45" rx="6" fill="#1b2336"/>
      <rect x="15" y="174" width="100" height="45" rx="6" fill="#1b2336"/>
      <circle cx="65" cy="235" r="5" fill="#374151"/>
    </g>

    <!-- Brand Label -->
    <g transform="translate(40, 305)">
      <text x="0" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800">NanoSpark <tspan fill="url(#nsGold)">Web Designing</tspan></text>
      <text x="0" y="46" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Collaborative Web Design &amp; Development Startup Initiative</text>
    </g>
  </g>
</svg>
