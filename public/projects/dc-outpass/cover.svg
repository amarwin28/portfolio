<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#121826" />
      <stop offset="100%" stop-color="#090c14" />
    </linearGradient>
    <linearGradient id="dcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="dcGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#dcBg)"/>
  <rect width="800" height="500" fill="url(#dcGrid)"/>

  <circle cx="400" cy="230" r="190" fill="#f59e0b" opacity="0.06" filter="url(#dcGlow)"/>

  <!-- Portal Mockup Container -->
  <g transform="translate(100, 60)">
    <rect width="600" height="380" rx="14" fill="#111622" stroke="rgba(251, 191, 36, 0.25)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="600" height="50" rx="14" fill="#171d2b"/>
    <rect y="40" width="600" height="10" fill="#171d2b"/>
    <circle cx="28" cy="25" r="5" fill="#ef4444"/>
    <circle cx="46" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="64" cy="25" r="5" fill="#10b981"/>
    
    <text x="120" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DC OUTPASS PORTAL</text>
    <rect x="290" y="14" width="180" height="22" rx="11" fill="rgba(255,255,255,0.05)"/>
    <text x="380" y="29" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dhaanish Chennai College</text>
    <rect x="500" y="14" width="76" height="22" rx="4" fill="url(#dcGold)"/>
    <text x="538" y="29" fill="#000000" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEW PASS</text>

    <!-- Stats row in portal -->
    <g transform="translate(30, 70)">
      <rect width="165" height="65" rx="8" fill="#151b27" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Total Requests</text>
      <text x="15" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1,248</text>

      <rect x="185" width="165" height="65" rx="8" fill="#151b27" stroke="rgba(255,255,255,0.06)"/>
      <text x="200" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Approved Passes</text>
      <text x="200" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1,180</text>

      <rect x="370" width="170" height="65" rx="8" fill="#151b27" stroke="rgba(255,255,255,0.06)"/>
      <text x="385" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Active on Campus</text>
      <text x="385" y="52" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="20" font-weight="800">68</text>
    </g>

    <!-- Outpass Table -->
    <g transform="translate(30, 155)">
      <rect width="540" height="195" rx="8" fill="#141a26" stroke="rgba(255,255,255,0.06)"/>
      
      <!-- Table Header -->
      <rect width="540" height="32" rx="8" fill="#192030"/>
      <rect y="24" width="540" height="8" fill="#192030"/>
      <text x="20" y="21" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STUDENT</text>
      <text x="150" y="21" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PURPOSE</text>
      <text x="290" y="21" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">OUT TIME</text>
      <text x="430" y="21" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STATUS</text>

      <!-- Row 1 -->
      <text x="20" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">CSE / Year II</text>
      <text x="150" y="60" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Academic Project</text>
      <text x="290" y="60" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">14:30 Today</text>
      <rect x="425" y="47" width="85" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
      <text x="467" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">APPROVED</text>
      <line x1="20" y1="78" x2="520" y2="78" stroke="rgba(255,255,255,0.04)"/>

      <!-- Row 2 -->
      <text x="20" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">ECE / Year III</text>
      <text x="150" y="100" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Symposium Travel</text>
      <text x="290" y="100" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">08:00 Tomorrow</text>
      <rect x="425" y="87" width="85" height="18" rx="9" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)"/>
      <text x="467" y="100" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PENDING</text>
      <line x1="20" y1="118" x2="520" y2="118" stroke="rgba(255,255,255,0.04)"/>

      <!-- Row 3 -->
      <text x="20" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">IT / Year I</text>
      <text x="150" y="140" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">Emergency Leave</text>
      <text x="290" y="140" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11">11:15 Today</text>
      <rect x="425" y="127" width="85" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
      <text x="467" y="140" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">GATE CHECKED</text>
    </g>
  </g>
</svg>
